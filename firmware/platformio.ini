[platformio]
default_envs = lovelace-as-002
src_dir = main

[env]
monitor_speed = 115200
monitor_filters = direct
board_build.filesystem = spiffs
build_flags = -Os

[env:lovelace-as-002]
platform = platformio/espressif32 @ 6.13.0
framework = espidf
board = esp-wrover-kit
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = components/boards/partitions.csv
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.bt;config/sdkconfig.defaults.flash8;config/sdkconfig.defaults.lovelace-wrover"
monitor_rts = 0
monitor_dtr = 0

; PCM capture is optional: keep production heap free for Wi-Fi + Bluetooth.
[env:lovelace-as-002-capture]
extends = env:lovelace-as-002
board_build.cmake_extra_args =
    "-DSDKCONFIG_DEFAULTS=config/sdkconfig.defaults;config/sdkconfig.defaults.bt;config/sdkconfig.defaults.flash8;config/sdkconfig.defaults.lovelace-wrover;config/sdkconfig.defaults.lovelace-capture"
